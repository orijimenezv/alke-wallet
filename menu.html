<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billetera Digital · Menú Principal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-9 col-md-7 col-lg-5">
        <div class="wallet-card p-4 p-md-5">
          <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <h2 class="wallet-header mb-0">Menú Principal</h2>
            <span class="badge rounded-pill text-bg-light border" id="userBadge">
              <i class="bi bi-person-circle me-1"></i><span id="userEmail">Usuario</span>
            </span>
          </div>

          <div class="saldo-box mb-4">
            <div class="saldo-label">Saldo disponible</div>
            <div class="saldo-monto" id="saldoActual">$0,00</div>
          </div>

          <div id="redireccionMensaje" class="alert alert-info py-2 d-none text-center" role="alert"></div>

          <div class="d-grid gap-3">
            <button type="button" id="btnDepositar" class="btn btn-wallet-primary menu-btn">
              <i class="bi bi-plus-circle me-2"></i>Depositar
            </button>
            <button type="button" id="btnRetirar" class="btn btn-wallet-outline menu-btn">
              <i class="bi bi-cash-stack me-2"></i>Retirar Dinero
            </button>
            <button type="button" id="btnMenuEnviar" class="btn btn-wallet-outline menu-btn">
              <i class="bi bi-send me-2"></i>Enviar Dinero
            </button>
            <button type="button" id="btnRecibir" class="btn btn-wallet-outline menu-btn">
              <i class="bi bi-arrow-down-circle me-2"></i>Recibir Dinero
            </button>
            <button type="button" id="btnMovimientos" class="btn btn-wallet-outline menu-btn">
              <i class="bi bi-clock-history me-2"></i>Últimos Movimientos
            </button>
          </div>

          <div class="text-center mt-4">
            <a href="login.html" class="wallet-footer-link small" id="logoutLink">
              <i class="bi bi-box-arrow-left me-1"></i>Cerrar sesión
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
