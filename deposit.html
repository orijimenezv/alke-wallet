<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billetera Digital · Depositar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-8 col-md-6 col-lg-5">
        <div class="wallet-card p-4 p-md-5">
          <div class="d-flex align-items-center mb-4">
            <a href="menu.html" class="btn btn-sm btn-light border me-3" aria-label="Volver al menú">
              <i class="bi bi-arrow-left"></i>
            </a>
            <h2 class="wallet-header mb-0">Depositar</h2>
          </div>

          <p class="text-muted">Ingresá el monto que querés depositar en tu billetera</p>

          <div class="saldo-box mb-4 py-3">
            <div class="saldo-label">Saldo actual</div>
            <div class="saldo-monto fs-3" id="saldoActual">$0,00</div>
          </div>

          <div id="alert-container"></div>

          <form id="depositForm" novalidate>
            <div class="mb-3">
              <label for="monto" class="form-label">Monto a depositar</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text">$</span>
                <input type="number" class="form-control" id="monto" placeholder="0,00" min="1" step="0.01" required>
              </div>
              <div class="invalid-feedback">Ingresá un monto válido mayor a 0</div>
            </div>

            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-wallet-primary btn-lg">
                <i class="bi bi-cash-coin me-2"></i>Realizar depósito
              </button>
            </div>
          </form>

          <div id="depositLegend" class="deposit-legend mt-3 d-none"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
