<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billetera Digital · Inicio de sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-8 col-md-6 col-lg-5">
        <div class="wallet-card p-4 p-md-5">
          <div class="wallet-icon-circle">
            <i class="bi bi-wallet2"></i>
          </div>

          <h2 class="wallet-header text-center">Inicio de sesión</h2>
          <p class="text-muted text-center mb-4">Ingresá a tu billetera digital</p>

          <div id="loginMensaje" class="alert d-none" role="alert"></div>

          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control form-control-lg" id="email" placeholder="usuario@wallet.com" required>
              <div class="invalid-feedback">Ingresá un correo electrónico válido</div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" class="form-control form-control-lg" id="password" placeholder="Contraseña" required>
              <div class="invalid-feedback">Ingresá tu contraseña</div>
            </div>

            <div class="d-grid mt-4">
              <button type="submit" id="btnLogin" class="btn btn-wallet-primary btn-lg">
                <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
              </button>
            </div>
          </form>

          <div class="demo-box mt-4">
            <div class="small fw-semibold mb-1">Datos para probar la billetera</div>
            <div class="small">correo usuario@wallet.com</div>
            <div class="small">contraseña 1234</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/wallet.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
