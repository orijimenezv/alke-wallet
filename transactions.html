<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billetera Digital · Últimos Movimientos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-10 col-md-8 col-lg-6">
        <div class="wallet-card p-4 p-md-5">
          <div class="d-flex align-items-center mb-4">
            <a href="menu.html" class="btn btn-sm btn-light border me-3" aria-label="Volver al menú">
              <i class="bi bi-arrow-left"></i>
            </a>
            <h2 class="wallet-header mb-0">Últimos Movimientos</h2>
          </div>

          <form id="filtroForm" class="mb-4">
            <label for="filtroTipo" class="form-label">Filtrar por tipo de movimiento</label>
            <select id="filtroTipo" class="form-select">
              <option value="todos">Todos los movimientos</option>
              <option value="compra">Compra</option>
              <option value="deposito">Depósito</option>
              <option value="retiro">Retiro</option>
              <option value="transferencia_recibida">Transferencia recibida</option>
              <option value="transferencia_enviada">Transferencia enviada</option>
            </select>
          </form>

          <div id="listaMovimientos" class="list-group mb-4"></div>
          <p id="sinMovimientos" class="text-muted text-center d-none">No hay movimientos para el filtro seleccionado</p>

          <div class="d-grid">
            <a href="menu.html" class="btn btn-wallet-primary btn-lg">
              <i class="bi bi-house-door me-2"></i>Volver al Menú Principal
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
